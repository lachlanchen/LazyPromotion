<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regression specimen</title>
  </head>
  <body>
    <main>
      <h1>Test workspace</h1>
      <form id="login-form">
        <label>Email <input name="email" type="email" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      document.querySelector("#login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const accepted = data.get("email") === "ada@example.test" &&
          data.get("password") === "fixture-pass";
        const status = document.querySelector("#status");
        status.textContent = accepted ? "Welcome, Ada" : "Email or password is incorrect";
        document.title = accepted ? "Dashboard" : "Regression specimen";
      });
    </script>
  </body>
</html>
